<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Origen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E110C; --surface:#171C14; --sunk:#20271B; --ink:#E6E9DD; --muted:#9AA391; --line:#2F3828;
  --cherry:#E4675B; --cherry-soft:rgba(228,103,91,.16); --leaf:#7DB88A; --leaf-soft:rgba(125,184,138,.15);
  --amber:#E2AA3C; --amber-soft:rgba(226,170,60,.15);
  --panel-w:400px; --top:56px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}

/* encabezado */
header{position:fixed;inset:0 0 auto 0;height:calc(var(--top) + var(--safe-t));padding:var(--safe-t) 14px 0;display:flex;align-items:center;gap:12px;z-index:5;
  background:linear-gradient(var(--bg) 40%,rgba(14,17,12,0));pointer-events:none}
header>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque";font-weight:700;font-size:17px;white-space:nowrap}
.bean{width:12px;height:16px;border-radius:50%;background:var(--cherry);position:relative;transform:rotate(-20deg)}
.bean:after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:2px;margin-left:-1px;border-radius:2px;background:var(--bg);transform:rotate(12deg)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;font-size:13.5px}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{padding:6px 8px;border-radius:8px;color:var(--muted);white-space:nowrap}
.crumbs button:hover{background:var(--sunk);color:var(--ink)}
.crumbs button:last-child{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--line)}
.back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none}
.back[hidden]{display:none}

/* globo */
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
canvas.hot{cursor:pointer}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip span{color:var(--muted)}
.zoom{position:fixed;z-index:4;display:flex;flex-direction:column;gap:6px;left:14px;bottom:calc(18px + var(--safe-b))}
.zoom button{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.zoom button:hover{border-color:var(--muted)}

/* panel */
#panel{position:fixed;z-index:5;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;
  right:14px;top:calc(var(--top) + var(--safe-t) + 4px);bottom:14px;width:var(--panel-w);border-radius:16px;overflow:hidden}
.ph{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.ph .kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph h2{font-size:24px;line-height:1.15}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.grab{display:none}
.pb{overflow-y:auto;padding:12px 12px 18px;flex:1;overscroll-behavior:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 2px}
.stat{background:var(--sunk);border-radius:10px;padding:8px 10px}
.stat .v{font-family:"IBM Plex Mono";font-size:19px;font-weight:500}
.stat .l{font-size:11.5px;color:var(--muted)}
.search{position:relative;margin:2px 0 10px}
.search input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 34px;color:var(--ink);font:inherit;font-size:14.5px;outline:none}
.search input:focus{border-color:var(--muted)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 6px 6px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:10px;border:1px solid transparent}
.row:hover,.row.hl{background:var(--sunk);border-color:var(--line)}
.row .dot{width:9px;height:9px;border-radius:50%;background:var(--cherry);flex:none}
.row .dot.off{background:transparent;border:1.5px solid var(--muted)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{font-family:"IBM Plex Mono";font-size:13px;color:var(--muted);flex:none}
.row .chev{color:var(--muted);flex:none}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--cherry-soft);color:var(--cherry);display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:700;font-size:14px;flex:none}
.prod{padding:11px 10px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .t{font-weight:600}
.prod .full{font-size:12.5px;color:var(--muted);margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.chip.p{background:var(--amber-soft);color:var(--amber)}
.chip.btn{cursor:pointer;background:var(--sunk);color:var(--muted);border:1px solid var(--line);padding:4px 10px;font-size:12.5px}
.chip.btn.on{background:var(--cherry-soft);color:var(--cherry);border-color:transparent}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px;margin:8px 0}
.empty{color:var(--muted);font-size:14px;padding:10px}
details.avisos{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.avisos summary{cursor:pointer;color:var(--amber);font-size:13.5px;padding:4px 6px;list-style:none}
details.avisos summary::-webkit-details-marker{display:none}
details.avisos li{font-size:13px;color:var(--muted);margin:4px 0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:6px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);z-index:9}

@media (max-width:760px){
  :root{--top:52px}
  .logo span{display:none}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:46vh;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:var(--safe-b);transition:height .25s ease}
  #panel.min{height:132px}
  #panel.max{height:calc(100vh - var(--top) - var(--safe-t) - 8px)}
  .grab{display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  .ph{padding:8px 16px 10px;cursor:pointer}
  .ph h2{font-size:21px}
  .zoom{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.prod .lots{font-family:"IBM Plex Mono";font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
</style>
</head>
<body>
<div class="loading" id="loading">Cargando el mapa…</div>
<div id="stage"><canvas id="cv"></canvas></div>
<header>
  <button class="back" id="back" hidden aria-label="Volver"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
  <div class="logo"><div class="bean"></div><span>Mapa de Origen</span></div>
  <nav class="crumbs" id="crumbs"></nav>
</header>
<div class="zoom"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button></div>
<aside id="panel"><div class="grab"></div><div class="ph" id="ph"></div><div class="pb" id="pb"></div></aside>
<div class="tip" id="tip"></div>

<script src="lib/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
